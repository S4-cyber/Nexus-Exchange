<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="432" viewBox="0 0 1024 432" role="img" aria-labelledby="title desc">
<title id="title">Nexus Exchange scoped context architecture</title><desc id="desc">Validated local scenario produces three bounded context layers. Source and policy pins persist at every tier. Governor prevents external authority.</desc>
<rect width="1024" height="432" fill="#111827"/>
<g font-family="system-ui, sans-serif" fill="#f3f4f6"><text x="40" y="44" font-size="24" font-weight="600">Nexus Exchange / Context harness</text><text x="40" y="68" font-size="13" fill="#b9c4d4">A local research architecture — not execution authority</text>
<g fill="#1f2937" stroke="#526078" stroke-width="1.5"><rect x="40" y="120" width="232" height="156" rx="8"/><rect x="312" y="112" width="248" height="56" rx="8"/><rect x="312" y="184" width="248" height="56" rx="8"/><rect x="312" y="256" width="248" height="56" rx="8"/><rect x="600" y="120" width="384" height="156" rx="8"/></g>
<text x="56" y="148" font-size="16" font-weight="600">Validated scenario</text><text x="56" y="178" font-size="13">Plan + observation revision</text><text x="56" y="200" font-size="13">Declared profile + policy</text><text x="56" y="222" font-size="13">Modeled Council snapshot</text><text x="56" y="246" font-size="12" fill="#a5b4fc">Exact SHA-256 binding</text>
<g font-size="15" font-weight="600"><text x="328" y="134">Summary</text><text x="328" y="206">Review</text><text x="328" y="278">Evidence</text></g><g font-size="12" fill="#b9c4d4"><text x="328" y="152">3 KiB • states and holds</text><text x="328" y="224">32 KiB • models and reasons</text><text x="328" y="296">48 KiB • reference IDs</text></g>
<text x="616" y="148" font-size="16" font-weight="600">Governor / bounded context</text><g font-size="13"><text x="616" y="178">Exact scope • fixed schema • no raw documents</text><text x="616" y="200">Explicit omitted layers • fail closed on overflow</text><text x="616" y="222">Local inspection only • no attempt consumed</text><text x="616" y="246" fill="#a5b4fc">No dispatch, source authentication or authority</text></g>
