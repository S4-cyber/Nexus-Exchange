name: Agent handoff (read-only)
on:
  push:
    branches:
      - review/agency-agent-handoff-foundation
  pull_request:
    paths:
      - 'nexus_exchange/agent_handoff.py'
      - 'tests/test_agent_handoff.py'
      - '.github/workflows/agent-handoff.yml'
jobs:
  handoff-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate compile and unit tests
        run: |
          python -m compileall -q nexus_exchange/agent_handoff.py tests/test_agent_handoff.py
          python -m unittest discover -s tests -p 'test_agent_handoff.py' -v
