name: Windows preview
on:
  push:
    branches: [review/windows-desktop, review/desktop-opportunity-browser, review/offline-procurement-import, review/desktop-deal-simulator, review/integrated-offline-baseline, review/scout-revenue-pathways, review/scout-sam-readonly-pilot, review/scout-global-trade-registry, review/scout-ted-keyless, review/scout-uk-fts, review/scout-canadabuys, review/scout-unified-lead-memory, review/scout-usaspending-contractors, review/scout-owner-capabilities, review/scout-persistent-todo, review/scout-aegis-file-evidence, main]
  pull_request:
    branches: [review/scout-persistent-scenarios, review/scout-review-ranking, review/scout-ranking-matrix, review/scout-assumption-evidence]
    paths: ['desktop.py', 'nexus_exchange/scenario_workspace.py', 'tests/test_scenario_workspace.py', 'nexus_exchange/ranking_workspace.py', 'nexus_exchange/review_ranking.py', 'tests/test_ranking_workspace.py', 'nexus_exchange/runtime_guard.py', 'nexus_exchange/event_store.py', 'nexus_exchange/dashboard_events.py', 'tests/test_runtime_guard.py', 'nexus_exchange/evidence_workspace.py', 'nexus_exchange/scenario_evidence.py', 'tests/test_evidence_workspace.py', 'tests/test_scenario_evidence.py', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest discover -s tests -v
      - run: python desktop.py --self-test
      - run: python desktop.py --gui-self-test
      - run: python -m pip install pyinstaller==6.12.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexusExchange desktop.py
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/NexusExchange.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable smoke test failed" }
          $g = Start-Process -FilePath dist/NexusExchange.exe -ArgumentList '--gui-self-test' -Wait -PassThru
          if ($g.ExitCode -ne 0) { throw "Executable GUI smoke test failed" }
          (Get-FileHash dist/NexusExchange.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexusExchange-Windows-x64-preview
          path: |
            dist/NexusExchange.exe
            dist/SHA256.txt
          if-no-files-found: error
