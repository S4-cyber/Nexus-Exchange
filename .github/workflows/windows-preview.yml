name: Windows preview
on:
  push:
    branches: [review/windows-desktop, review/desktop-opportunity-browser, review/offline-procurement-import, review/desktop-deal-simulator, review/integrated-offline-baseline, review/scout-revenue-pathways, review/scout-sam-readonly-pilot, review/scout-global-trade-registry, review/scout-ted-keyless, review/scout-uk-fts, review/scout-canadabuys, review/scout-unified-lead-memory, review/scout-usaspending-contractors, review/scout-owner-capabilities, review/scout-persistent-todo, review/scout-aegis-file-evidence, main]
  pull_request:
    branches: [review/scout-persistent-scenarios, review/scout-review-ranking, review/scout-ranking-matrix, review/scout-assumption-evidence, review/council-durable-audit, review/council-runtime-recovery, review/operator-scenario-scope, review/operator-recipient-evidence, review/browser-offline-transport, review/browser-runtime-diagnostics, review/scout-fixture-process, review/scout-responsive-process, review/public-api-commercial-adoption, review/atlas-sec-counterparty, review/operator-csv-deliverable, review/operator-native-csv, review/operator-obligation-ledger, review/operator-simulated-receivables]
    paths: ['desktop.py', 'nexus_exchange/scenario_workspace.py', 'tests/test_scenario_workspace.py', 'nexus_exchange/ranking_workspace.py', 'nexus_exchange/review_ranking.py', 'tests/test_ranking_workspace.py', 'nexus_exchange/runtime_guard.py', 'nexus_exchange/event_store.py', 'nexus_exchange/dashboard_events.py', 'tests/test_runtime_guard.py', 'nexus_exchange/evidence_workspace.py', 'nexus_exchange/scenario_evidence.py', 'tests/test_evidence_workspace.py', 'tests/test_scenario_evidence.py', 'nexus_exchange/council_attempts.py', 'nexus_exchange/council_audit.py', 'nexus_exchange/council_coordinator.py', 'nexus_exchange/council_criterion_review.py', 'nexus_exchange/scenario_council.py', 'tests/test_council_runtime_recovery.py', 'nexus_exchange/council_workspace.py', 'tests/test_council_workspace.py', 'nexus_exchange/operator_drafts.py', 'nexus_exchange/operator_scenarios.py', 'nexus_exchange/operator_workspace.py', 'tests/test_operator_workspace.py', 'tests/test_operator_scenario_integration.py', 'nexus_exchange/context_packet.py', 'tests/test_context_packet.py', 'nexus_exchange/browser_fixture_runner.py', 'tests/test_browser_runtime.py', 'nexus_exchange/browser_process.py', 'tests/test_browser_process.py', 'tests/test_browser_process_runtime.py', 'nexus_exchange/fx_reference.py', 'tests/test_fx_reference.py', 'nexus_exchange/trade_registry.py', 'tests/test_trade_registry.py', 'nexus_exchange/sec_company.py', 'tests/test_sec_company.py', 'nexus_exchange/cf_search.py', 'tests/test_cf_search.py', 'nexus_exchange/lead_store.py', 'nexus_exchange/owner_profile.py', 'nexus_exchange/digital_deliverable.py', 'nexus_exchange/deliverable_files.py', 'nexus_exchange/csv_workspace.py', 'tests/test_deliverable_files.py', 'nexus_exchange/deliverable_obligations.py', 'tests/test_deliverable_obligations.py', 'nexus_exchange/obligation_workspace.py', 'tests/test_obligation_workspace.py', 'nexus_exchange/simulated_receivables.py', 'nexus_exchange/finance_workspace.py', 'tests/test_finance_workspace.py', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest discover -s tests -v
      - run: python desktop.py --self-test
      - run: python desktop.py --gui-self-test
      - run: python desktop.py --fixture-process-self-test
      - run: python -m pip install pyinstaller==6.12.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexusExchange desktop.py
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/NexusExchange.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable smoke test failed" }
          $g = Start-Process -FilePath dist/NexusExchange.exe -ArgumentList '--gui-self-test' -Wait -PassThru
          if ($g.ExitCode -ne 0) { throw "Executable GUI smoke test failed" }
          $f = Start-Process -FilePath dist/NexusExchange.exe -ArgumentList '--fixture-process-self-test' -Wait -PassThru
          if ($f.ExitCode -ne 0) { throw "Executable fixture process smoke test failed" }
          (Get-FileHash dist/NexusExchange.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexusExchange-Windows-x64-preview
          path: |
            dist/NexusExchange.exe
            dist/SHA256.txt
          if-no-files-found: error
